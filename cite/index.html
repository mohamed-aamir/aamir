<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Paper Citation Graph</title>
    <link rel="stylesheet" href="style.css">
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div id="container">
        <header>
            <h1>Paper Citation Grapher</h1>
            <p>Upload PDFs to build a relationship map. No AI, 100% local.</p>
            <input type="file" id="file-input" multiple accept=".pdf">
            <button id="clear-btn">Clear Graph</button>
        </header>
        <div id="graph-container"></div>
        <div id="status">Ready.</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
